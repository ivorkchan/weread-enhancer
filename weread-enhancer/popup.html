<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WeRead Enhancer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>WeRead Enhancer</h1>
      <span class="version" id="version"></span>
    </header>

    <section class="section">
      <h2 class="section-title">General</h2>
      <div class="card">
        <label class="row">
          <span class="row-label">Hide recommendations</span>
          <input type="checkbox" class="switch" id="hide-recommendations" />
        </label>
        <label class="row">
          <span class="row-label">Hide account details</span>
          <input type="checkbox" class="switch" id="hide-account-details" />
        </label>
        <label class="row">
          <span class="row-label">Hide navbar links</span>
          <input type="checkbox" class="switch" id="hide-navbar-links" />
        </label>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Reader</h2>
      <div class="card">
        <label class="row">
          <span class="row-label">Align text to start</span>
          <input type="checkbox" class="switch" id="text-align-start" />
        </label>
        <label class="row">
          <span class="row-label">Change background color</span>
          <input type="checkbox" class="switch" id="change-background-color" />
        </label>
        <label class="row">
          <span class="row-label">Simplify floating buttons</span>
          <input type="checkbox" class="switch" id="simplify-floating-buttons" />
        </label>
        <div class="row">
          <label class="row-label" for="font-family">Font family</label>
          <select id="font-family" class="field">
            <option value="font-default">Default</option>
            <option value="font-songti">Songti</option>
            <option value="font-kaiti">Kaiti</option>
            <option value="font-heiti">Heiti</option>
            <option value="font-custom">Custom</option>
          </select>
        </div>
        <div class="row sub-row" id="custom-font-row" hidden>
          <label class="row-label" for="custom-font-name">Font name</label>
          <input type="text" id="custom-font-name" class="field" placeholder="e.g. Kaiti SC" spellcheck="false" />
        </div>
        <label class="row">
          <span class="row-label">Latin font from fonts/latin.*</span>
          <input type="checkbox" class="switch" id="font-latin" />
        </label>
      </div>
    </section>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
